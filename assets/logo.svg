<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220">

  <!-- Flames: outer tongues (red) -->
  <path d="
    M 120,70
    C 104,58 110,44 104,30
    C 100,20 108,12 106,2
    C 118,12 114,24 122,32
    C 128,20 122,12 128,4
    C 140,16 134,30 140,40
    C 146,30 142,24 148,18
    C 156,30 150,46 142,56
    C 136,64 128,70 120,70
    Z" fill="#e22828"/>
  <path d="
    M 94,72 C 84,64 88,52 82,44
    C 78,38 84,32 82,26
    C 92,34 90,46 96,54
    C 100,62 100,68 94,72 Z" fill="#e22828" opacity="0.85"/>
  <path d="
    M 148,70 C 158,62 154,52 160,44
    C 164,38 158,32 160,26
    C 150,34 152,44 146,52
    C 142,60 142,66 148,70 Z" fill="#e22828" opacity="0.85"/>

  <!-- Flames: inner glow (orange/yellow) -->
  <path d="
    M 120,68
    C 110,58 116,46 112,34
    C 110,26 116,20 114,12
    C 124,22 118,34 126,42
    C 130,34 126,28 130,22
    C 138,34 134,48 128,58
    C 124,64 122,68 120,68
    Z" fill="#ff7a18"/>
  <path d="
    M 120,66 C 114,58 120,50 118,42
    C 126,50 122,58 124,52
    C 128,58 126,64 120,66 Z" fill="#ffc224"/>

  <!-- Skull: cranium + cheeks + jaw -->
  <path d="
    M 120,58
    C 90,58 72,80 72,106
    C 72,122 79,133 88,138
    L 88,154
    C 88,161 93,166 100,166
    L 140,166
    C 147,166 152,161 152,154
    L 152,138
    C 161,133 168,122 168,106
    C 168,80 150,58 120,58
    Z" fill="#e8e8e8"/>

  <!-- Eye sockets -->
  <ellipse cx="101" cy="108" rx="12" ry="13" fill="#1c1c1c"/>
  <ellipse cx="139" cy="108" rx="12" ry="13" fill="#1c1c1c"/>
  <!-- Flame glints in the sockets -->
  <circle cx="104" cy="105" r="3.5" fill="#e22828"/>
  <circle cx="142" cy="105" r="3.5" fill="#e22828"/>

  <!-- Nasal cavity -->
  <path d="M 120,122 L 113,136 Q 120,141 127,136 Z" fill="#1c1c1c"/>

  <!-- Teeth separators -->
  <line x1="104" y1="150" x2="104" y2="165" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="150" x2="112" y2="166" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="150" x2="120" y2="166" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="150" x2="128" y2="166" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="136" y1="150" x2="136" y2="165" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Tooth line -->
  <line x1="92" y1="150" x2="148" y2="150" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/>

  <!-- Small MCP plug icon under skull — three dots hinting at API nodes -->
  <circle cx="105" cy="200" r="3" fill="#e22828" opacity="0.55"/>
  <circle cx="120" cy="200" r="3" fill="#e22828" opacity="0.55"/>
  <circle cx="135" cy="200" r="3" fill="#e22828" opacity="0.55"/>
  <line x1="105" y1="200" x2="135" y2="200" stroke="#e22828" stroke-width="1.2" opacity="0.30"/>

  <!-- Wordmark: BRAINLESS (white, large) -->
  <text x="194" y="128"
        font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace"
        font-size="56" font-weight="700"
        fill="#e8e8e8">BRAINLESS</text>

  <!-- Wordmark: — MCP (red, slightly smaller, same baseline) -->
  <text x="506" y="128"
        font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace"
        font-size="38" font-weight="700"
        fill="#e22828">&#8212; MCP</text>

  <!-- Divider line between wordmark and tagline -->
  <line x1="194" y1="143" x2="650" y2="143"
        stroke="#3a3a3a" stroke-width="1"/>

  <!-- Tagline -->
  <text x="196" y="163"
        font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace"
        font-size="13" font-weight="600"
        fill="#9a9a9a" letter-spacing="4">UNRAID CONTROL</text>

</svg>
